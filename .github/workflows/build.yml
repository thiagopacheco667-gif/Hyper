name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Nomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "DynamicIsland-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-${{ github.run_number }}
          path: DynamicIsland-*.apk

      # Publica em Releases para baixar direto no celular, sem login nem .zip.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dynamic Island 2.0 · build ${{ github.run_number }}
          body: Gerado automaticamente a partir de ${{ github.sha }}.
          files: DynamicIsland-*.apk
          make_latest: "true"
